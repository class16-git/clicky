<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Clickety Desk</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#4ECDC4;--coral:#FF6B6B;--orange:#FFB347;--purple:#9B59B6;--dark:#0a0a1a;--paper:#fffef0}
body{font-family:system-ui,sans-serif;background:var(--dark);color:#fff;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
::selection{background:var(--teal);color:#000}
/* HOME SCREEN */
#home-screen{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:radial-gradient(ellipse at 50% 0%,#1a053a 0%,#0a0a1a 60%);overflow:hidden}
.home-blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;animation:blobDrift 8s ease-in-out infinite alternate}
.blob1{width:500px;height:500px;background:var(--teal);top:-100px;left:-100px;animation-delay:0s}
.blob2{width:400px;height:400px;background:var(--purple);bottom:-80px;right:-80px;animation-delay:-4s}
@keyframes blobDrift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,20px) scale(1.1)}}
.home-stars{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.home-star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;animation:twinkle 2s ease-in-out infinite alternate}
@keyframes twinkle{0%{opacity:.2;transform:scale(1)}100%{opacity:1;transform:scale(1.5)}}
.home-float{position:absolute;font-size:48px;animation:floatIcon 6s ease-in-out infinite alternate}
@keyframes floatIcon{0%{transform:translateY(0) rotate(-5deg)}100%{transform:translateY(-20px) rotate(5deg)}}
.home-badge{position:relative;background:rgba(78,205,196,.15);border:1px solid rgba(78,205,196,.4);border-radius:100px;padding:6px 20px;font-size:14px;color:var(--teal);z-index:1}
.home-badge::before{content:'●';color:#34A853;margin-right:8px;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.home-title{position:relative;font-size:clamp(36px,8vw,64px);font-weight:900;background:linear-gradient(135deg,#fff 0%,var(--teal) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;z-index:1;text-align:center}
.home-subtitle{position:relative;font-size:clamp(14px,3vw,20px);color:rgba(255,255,255,.7);z-index:1;text-align:center}
.home-enter{position:relative;width:min(340px,92vw);height:72px;border:none;border-radius:16px;background:linear-gradient(135deg,var(--coral),var(--orange));color:#fff;font-size:22px;font-weight:900;cursor:pointer;box-shadow:0 8px 32px rgba(255,107,107,.4);transition:transform .15s,box-shadow .15s;touch-action:manipulation;z-index:1}
.home-enter:hover{transform:scale(1.05);box-shadow:0 12px 40px rgba(255,107,107,.6)}
.home-enter:active{transform:scale(.97)}
@keyframes enterBounce{0%{transform:scale(1)}30%{transform:scale(1.1)}60%{transform:scale(.95)}100%{transform:scale(1)}}
.home-enter.bouncing{animation:enterBounce .4s ease}
.home-hint{display:flex;gap:12px;position:relative;z-index:1}
.home-hint span{font-size:12px;color:rgba(255,255,255,.5);background:rgba(255,255,255,.08);padding:4px 12px;border-radius:100px}
.home-footer{position:relative;font-size:13px;color:rgba(255,255,255,.35);z-index:1}
.home-pills{display:flex;gap:10px;position:relative;z-index:1}
.home-pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);padding:6px 16px;border-radius:100px;font-size:13px;cursor:pointer;transition:all .2s}
.home-pill:hover{background:rgba(255,255,255,.2)}
.home-pill.active{background:var(--teal);color:#000;border-color:var(--teal)}
/* CONFETTI */
#confetti-container{position:fixed;inset:0;pointer-events:none;z-index:9998;overflow:hidden}
.confetti-piece{position:absolute;width:10px;height:10px;top:-10px;animation:confettiFall 3s ease-in forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
@keyframes confettiFallRm{0%{opacity:1}100%{opacity:0}}
/* SPARKLE */
.sparkle{position:absolute;pointer-events:none;z-index:9997;animation:sparklePop .6s ease-out forwards}
@keyframes sparklePop{0%{transform:scale(0) rotate(0deg);opacity:1}100%{transform:scale(1.5) rotate(180deg);opacity:0}}
/* EMOJI FLOAT */
.emoji-float{position:absolute;pointer-events:none;z-index:9997;font-size:28px;animation:emojiRise 1.5s ease-out forwards}
@keyframes emojiRise{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-120px) scale(1.5);opacity:0}}
/* RAINBOW FLASH */
@keyframes rainbowFlash{0%{border-color:#ff0000;box-shadow:0 0 30px #ff0000}16%{border-color:#ff8800;box-shadow:0 0 30px #ff8800}33%{border-color:#ffff00;box-shadow:0 0 30px #ffff00}50%{border-color:#00ff00;box-shadow:0 0 30px #00ff00}66%{border-color:#0088ff;box-shadow:0 0 30px #0088ff}83%{border-color:#8800ff;box-shadow:0 0 30px #8800ff}100%{border-color:var(--teal);box-shadow:0 0 0 transparent}}
.rainbow-flash{animation:rainbowFlash 1.2s ease}
/* CHROME FRAME */
#chrome-frame{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--dark);opacity:0;transition:opacity .5s}
#chrome-frame.visible{opacity:1}
.chrome-tabs{display:flex;align-items:center;gap:2px;padding:8px 12px 0;background:#1e1e2e;border-bottom:1px solid rgba(255,255,255,.1)}
.chrome-tab{flex:1;max-width:140px;padding:10px 16px;background:rgba(255,255,255,.05);border:none;border-radius:8px 8px 0 0;color:rgba(255,255,255,.6);font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;touch-action:manipulation}
.chrome-tab:hover{background:rgba(255,255,255,.1);color:#fff}
.chrome-tab.active{background:rgba(255,255,255,.12);color:#fff;font-weight:700}
.chrome-body{flex:1;position:relative;overflow:hidden}
.chrome-bar{display:flex;align-items:center;justify-content:space-around;padding:6px 12px;background:#1e1e2e;border-top:1px solid rgba(255,255,255,.1)}
.bar-btn{width:52px;height:52px;border-radius:12px;border:none;background:rgba(255,255,255,.08);color:#fff;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;touch-action:manipulation}
.bar-btn:hover{background:rgba(255,255,255,.18);transform:scale(1.1)}
.bar-btn:active{transform:scale(.93)}
.bar-btn.active{background:var(--teal);color:#000}
/* WORLD PANELS */
.world{position:absolute;inset:0;display:none;padding:20px;overflow:auto}
.world.active{display:block}
/* ===== PAPER WORLD ===== */
#paper-world{background:var(--paper)}
.paper-toolbar{display:flex;gap:6px;padding:10px;background:#f0f0e8;border-radius:12px 12px 0 0;border-bottom:1px solid #ddd;flex-wrap:wrap}
.p-tool{width:44px;height:44px;border-radius:8px;border:1px solid rgba(0,0,0,.15);background:#fff;color:#333;font-size:16px;font-weight:700;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.p-tool:hover{background:#f5f5f0;transform:scale(1.1)}
.p-tool:active{transform:scale(.93)}
.paper-canvas{min-height:calc(100% - 70px);background:#fff;border-radius:0 0 12px 12px;padding:20px;font-size:18px;line-height:1.8;outline:none;overflow:auto;color:#222;position:relative}
.paper-canvas:empty::before{content:'✏️ TAP TO WRITE!';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:rgba(0,0,0,.2);animation:writePulse 2s ease-in-out infinite;pointer-events:none}
@keyframes writePulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.8;transform:scale(1.03)}}
/* ===== TERMINAL WORLD ===== */
#terminal-world{background:#0d1117;font-family:'Courier New',Courier,monospace}
.term-header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#161b22;border-radius:12px 12px 0 0;border-bottom:1px solid rgba(78,205,196,.3)}
.term-dot{width:12px;height:12px;border-radius:50%}
.term-dot.r{background:#ff5f56}.term-dot.y{background:#ffbd2e}.term-dot.g{background:#27c93f}
.term-title{color:rgba(255,255,255,.5);font-size:13px;margin-left:auto}
.term-output{min-height:180px;max-height:calc(100% - 320px);overflow-y:auto;padding:14px;font-size:16px;line-height:1.7;scrollbar-width:thin;scrollbar-color:rgba(78,205,196,.3) transparent}
.term-line{margin:2px 0}
.t-cmd{color:var(--teal);font-weight:700}
.t-ok{color:#27c93f}
.t-err{color:#ff5f56}
.term-idle{color:rgba(255,255,255,.25);font-size:15px;animation:blink 1s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.term-logo{font-size:72px;text-align:center;animation:termPulse 2s ease-in-out infinite alternate}
@keyframes termPulse{0%{transform:scale(1)}100%{transform:scale(1.08)}}
.term-commands{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0}
.cmd-card{width:calc(50% - 4px);min-height:70px;border-radius:12px;border:2px solid rgba(78,205,196,.3);background:rgba(78,205,196,.08);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:all .15s;touch-action:manipulation}
.cmd-card:hover{background:rgba(78,205,196,.2);border-color:var(--teal);transform:scale(1.03)}
.cmd-card:active{transform:scale(.95)}
.cmd-emoji{font-size:32px;line-height:1}
.cmd-label{font-size:12px;color:rgba(255,255,255,.6)}
.term-input-row{display:flex;align-items:center;gap:8px;padding:10px;background:rgba(78,205,196,.05);border:1px solid rgba(78,205,196,.2);border-radius:8px}
.term-prompt{color:var(--teal);font-size:16px;font-weight:700}
#term-input-display{flex:1;font-size:16px;color:#fff;min-height:24px;outline:none;white-space:pre-wrap;word-break:break-all}
#term-input-hidden{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
/* ===== CALL WORLD ===== */
#call-world{background:#0d1117;display:flex;flex-direction:column;gap:16px}
.call-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#161b22;border-radius:12px}
.call-live{display:flex;align-items:center;gap:6px;color:#34A853;font-size:14px;font-weight:700}
.call-live-dot{width:8px;height:8px;border-radius:50%;background:#34A853;animation:livePulse 1.5s ease-in-out infinite}
@keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}
.meet-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;flex:1}
.meet-tile{background:#1c2128;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:140px;position:relative;overflow:hidden;transition:all .3s}
.tile-avatar{font-size:52px;animation:avatarBounce 2s ease-in-out infinite alternate}
@keyframes avatarBounce{0%{transform:translateY(0)}100%{transform:translateY(-6px)}}
.tile-name{font-size:14px;color:rgba(255,255,255,.8);font-weight:500}
.tile-waving{position:absolute;top:8px;right:8px;font-size:24px;animation:wavingHand .8s ease-in-out infinite alternate}
@keyframes wavingHand{0%{transform:rotate(-15deg)}100%{transform:rotate(15deg)}}
.tile-speaking{position:absolute;inset:0;border:3px solid var(--teal);border-radius:12px;opacity:0;transition:opacity .3s}
.meet-tile.speaking .tile-speaking{opacity:1;animation:ringPulse 2s ease-in-out infinite}
@keyframes ringPulse{0%,100%{box-shadow:0 0 0 0 rgba(78,205,196,.4)}50%{box-shadow:0 0 0 8px rgba(78,205,196,0)}}
.meet-emoji-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.emoji-btn{width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);font-size:24px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.emoji-btn:hover{background:rgba(78,205,196,.2);border-color:var(--teal);transform:scale(1.15)}
.emoji-btn:active{transform:scale(.9)}
.meet-controls{display:flex;justify-content:center;gap:12px;padding:10px}
.ctrl-btn{width:48px;height:48px;border-radius:50%;border:none;font-size:22px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.ctrl-btn:hover{transform:scale(1.1)}
.ctrl-btn.mic{background:#3d3d3d;color:#fff}
.ctrl-btn.cam{background:#3d3d3d;color:#fff}
.ctrl-btn.share{background:#3d3d3d;color:#fff}
.ctrl-btn.hand{background:#3d3d3d;color:#fff}
.ctrl-btn.on{background:var(--teal);color:#000}
/* Reduced motion */
@media(prefers-reduced-motion:reduce){
*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
/* Hidden utility */
.hidden{display:none!important}
</style>
</head>
<body>

<!-- HOME SCREEN -->
<div id="home-screen">
  <div class="home-blob blob1"></div>
  <div class="home-blob blob2"></div>
  <div class="home-stars" id="home-stars"></div>
  <div class="home-badge">💫 1,000+ little workers right now!</div>
  <h1 class="home-title">Clickety Desk</h1>
  <p class="home-subtitle">Like Daddy's computer! ⌨️</p>
  <button class="home-enter" id="home-enter" onclick="doEnter()">START WORKING! ⌨️ ✨</button>
  <div class="home-pills">
    <button class="home-pill active" onclick="pickTheme('chrome')">Chrome 👀</button>
    <button class="home-pill" onclick="pickTheme('space')">Space 🌌</button>
  </div>
  <div class="home-hint">
    <span>⌨️ Chrome</span>
    <span>🌌 Space</span>
  </div>
  <p class="home-footer">No account. Just pretend.</p>
</div>

<!-- CONFETTI -->
<div id="confetti-container"></div>

<!-- CHROME FRAME -->
<div id="chrome-frame">
  <div class="chrome-tabs">
    <button class="chrome-tab active" id="tab-paper" onclick="goTo('paper')">📝 Docs</button>
    <button class="chrome-tab" id="tab-terminal" onclick="goTo('terminal')">💻 Terminal</button>
    <button class="chrome-tab" id="tab-call" onclick="goTo('call')">📹 Meet</button>
  </div>
  <div class="chrome-body">
    <!-- PAPER WORLD -->
    <div id="paper-world" class="world active">
      <div class="paper-toolbar">
        <button class="p-tool" onclick="formatDoc('bold')" title="Bold"><b>B</b></button>
        <button class="p-tool" onclick="formatDoc('italic')" title="Italic"><i>I</i></button>
        <button class="p-tool" onclick="formatDoc('underline')" title="Underline"><u>U</u></button>
        <button class="p-tool" onclick="formatDoc('foreColor','#e74c3c')" title="Red" style="color:#e74c3c">●</button>
        <button class="p-tool" onclick="formatDoc('foreColor','#27c93f')" title="Green" style="color:#27c93f">●</button>
        <button class="p-tool" onclick="formatDoc('foreColor','#3498db')" title="Blue" style="color:#3498db">●</button>
        <button class="p-tool" onclick="formatDoc('fontSize','5')" title="Bigger">A+</button>
        <button class="p-tool" onclick="formatDoc('fontSize','2')" title="Smaller">A−</button>
      </div>
      <div class="paper-canvas" id="paper-canvas" contenteditable="true" spellcheck="false"></div>
    </div>
    <!-- TERMINAL WORLD -->
    <div id="terminal-world" class="world">
      <div class="term-header">
        <div class="term-dot r"></div>
        <div class="term-dot y"></div>
        <div class="term-dot g"></div>
        <span class="term-title">terminal — clickety</span>
      </div>
      <div class="term-output" id="term-output">
        <div class="term-logo">💻</div>
      </div>
      <div class="term-commands" id="term-commands">
        <div class="cmd-card" onclick="runCmd('ping')"><div class="cmd-emoji">🏓</div><div class="cmd-label">ping</div></div>
        <div class="cmd-card" onclick="runCmd('deploy')"><div class="cmd-emoji">🚀</div><div class="cmd-label">deploy</div></div>
        <div class="cmd-card" onclick="runCmd('backup')"><div class="cmd-emoji">💾</div><div class="cmd-label">backup</div></div>
        <div class="cmd-card" onclick="runCmd('neofetch')"><div class="cmd-emoji">🖥️</div><div class="cmd-label">neofetch</div></div>
        <div class="cmd-card" onclick="runCmd('colorbomb')"><div class="cmd-emoji">🎨</div><div class="cmd-label">colorbomb</div></div>
        <div class="cmd-card" onclick="runCmd('matrix')"><div class="cmd-emoji">🌈</div><div class="cmd-label">matrix</div></div>
        <div class="cmd-card" onclick="runCmd('hack')"><div class="cmd-emoji">💥</div><div class="cmd-label">hack</div></div>
        <div class="cmd-card" onclick="runCmd('virus')"><div class="cmd-emoji">🦠</div><div class="cmd-label">virus</div></div>
      </div>
      <div class="term-input-row">
        <span class="term-prompt">❯</span>
        <div id="term-input-display" tabindex="0"></div>
        <input type="text" id="term-input-hidden" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>
    </div>
    <!-- CALL WORLD -->
    <div id="call-world" class="world">
      <div class="call-header">
        <span style="font-weight:700">📹 Clickety Meet</span>
        <div class="call-live"><div class="call-live-dot"></div>LIVE</div>
      </div>
      <div class="meet-grid">
        <div class="meet-tile speaking" id="tile-0"><div class="tile-speaking"></div><div class="tile-avatar">😊</div><div class="tile-name">Me</div><div class="tile-waving">👋</div></div>
        <div class="meet-tile" id="tile-1"><div class="tile-speaking"></div><div class="tile-avatar">👧</div><div class="tile-name">Aya</div></div>
        <div class="meet-tile" id="tile-2"><div class="tile-speaking"></div><div class="tile-avatar">👨</div><div class="tile-name">Papa</div></div>
        <div class="meet-tile" id="tile-3"><div class="tile-speaking"></div><div class="tile-avatar">👩</div><div class="tile-name">Ibu</div></div>
      </div>
      <div class="meet-emoji-bar">
        <button class="emoji-btn" onclick="reactEmoji('👏')">👏</button>
        <button class="emoji-btn" onclick="reactEmoji('😍')">😍</button>
        <button class="emoji-btn" onclick="reactEmoji('🎉')">🎉</button>
        <button class="emoji-btn" onclick="reactEmoji('❤️')">❤️</button>
        <button class="emoji-btn" onclick="reactEmoji('🔥')">🔥</button>
        <button class="emoji-btn" onclick="reactEmoji('😂')">😂</button>
      </div>
      <div class="meet-controls">
        <button class="ctrl-btn mic" id="mic-btn" onclick="toggleMic()">🎤</button>
        <button class="ctrl-btn cam" id="cam-btn" onclick="toggleCam()">📹</button>
        <button class="ctrl-btn share" onclick="doSparkle()">🖥️</button>
        <button class="ctrl-btn hand" onclick="toggleHand()">✋</button>
      </div>
    </div>
  </div><!-- /chrome-body -->
  <div class="chrome-bar">
    <button class="bar-btn active" id="bar-paper" onclick="goTo('paper')">📝</button>
    <button class="bar-btn" id="bar-terminal" onclick="goTo('terminal')">💻</button>
    <button class="bar-btn" id="bar-call" onclick="goTo('call')">📹</button>
  </div>
</div><!-- /chrome-frame -->

<script>
// =============================================================================
// SOUND ENGINE — AudioContext created on first user gesture only
// =============================================================================
let audioCtx = null;

function ensureAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}

function tone(freq, type, start, dur) {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(.25, audioCtx.currentTime + start);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + start + dur);
    o.start(audioCtx.currentTime + start);
    o.stop(audioCtx.currentTime + start + dur + .05);
  } catch(e) {}
}

function play(name) {
  ensureAudio();
  if (!audioCtx) return;
  try {
    switch(name) {
      case 'sparkle': tone(1047,'sine',0,.08); break;
      case 'happy':
        [523,659,784,1047].forEach((f,i)=>tone(f,'sine',i*.1,.2));
        break;
      case 'enter':
        [523,659,784].forEach((f,i)=>tone(f,'sine',i*.08,.15));
        break;
      case 'twinkle':
        [392,392,392,392,523,659,784,659,
         880,880,880,880,784,698,659,523,
         784,784,784,784,698,659,523,
         659,659,659,659,523,392,440,523,392].forEach((f,i)=>tone(f,'sine',i*.22,.2));
        break;
      case 'snap':
        try {
          const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*.05,audioCtx.sampleRate);
          const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1);
          const src=audioCtx.createBufferSource(); src.buffer=buf;
          src.connect(audioCtx.destination); src.start();
        } catch(e){}
        break;
      case 'boot': tone(330,'sine',0,.3); break;
      case 'chaos':
        [880,784,659,523,440,392,330,262].forEach((f,i)=>tone(f,'sine',i*.07,.12));
        break;
      case 'err': tone(150,'sawtooth',0,.2); break;
    }
  } catch(e){}
}

// =============================================================================
// CELEBRATION HELPERS
// =============================================================================
const CONFETTI_COLORS = ['#ff6b6b','#ffb347','#ffff66','#69ff66','#66c8ff','#c866ff','#ff66c8'];

function confettiBurst() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.getElementById('confetti-container');
  if (!c) return;
  for (let i = 0; i < 50; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random() * 100 + '%';
    p.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
    p.style.animationDuration = (2 + Math.random() * 2) + 's';
    p.style.animationDelay = Math.random() * .5 + 's';
    c.appendChild(p);
    setTimeout(() => p.remove(), 4000);
  }
}

function sparkleBurst(x, y, count = 12) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('div');
  c.style.cssText = `position:fixed;left:${x}px;top:${y}px;pointer-events:none;z-index:9997`;
  document.body.appendChild(c);
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    const angle = (i / count) * Math.PI * 2;
    const dist = 30 + Math.random() * 40;
    const size = 6 + Math.random() * 8;
    s.className = 'sparkle';
    s.textContent = ['✦','✧','⋆','✶','✷'][Math.floor(Math.random()*5)];
    s.style.cssText = `left:${Math.cos(angle)*dist}px;top:${Math.sin(angle)*dist}px;font-size:${size}px;color:${CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)]};position:absolute`;
    c.appendChild(s);
    setTimeout(() => s.remove(), 600);
  }
  setTimeout(() => c.remove(), 700);
}

function emojiBurst(x, y, emoji) {
  const el = document.createElement('div');
  el.className = 'emoji-float';
  el.textContent = emoji;
  el.style.cssText = `left:${x}px;top:${y}px;font-size:32px`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

function sparkleAt(el) {
  if (!el) return;
  const r = el.getBoundingClientRect();
  sparkleBurst(r.left + r.width/2, r.top + r.height/2, 10);
}

// =============================================================================
// NAVIGATION
// =============================================================================
function goTo(world) {
  try { play('sparkle'); } catch(e) {}
  switchWorld(world);
}

function switchWorld(world) {
  document.querySelectorAll('.world').forEach(w => w.classList.remove('active'));
  document.querySelectorAll('.chrome-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.bar-btn').forEach(b => b.classList.remove('active'));
  const w = document.getElementById(world + '-world');
  if (w) w.classList.add('active');
  const t = document.getElementById('tab-' + world);
  if (t) t.classList.add('active');
  const b = document.getElementById('bar-' + world);
  if (b) b.classList.add('active');
  state.world = world;
  if (world === 'terminal') { initTerminal(); tryEnterTerminal(); }
  else if (world === 'call') { initCall(); }
  else if (world === 'paper') { initDocs(); }
}

function doEnter() {
  try { play('happy'); } catch(e) {}
  const home = document.getElementById('home-screen');
  if (home) home.style.display = 'none';
  const frame = document.getElementById('chrome-frame');
  if (frame) frame.classList.add('visible');
  sparkleBurst(window.innerWidth/2, window.innerHeight/2, 20);
  confettiBurst();
  try { tryFullscreen(); } catch(e) {}
  switchWorld('paper');
}

function pickTheme(theme) {
  document.querySelectorAll('.home-pill').forEach(p => p.classList.remove('active'));
  const btn = document.querySelector(`.home-pill[onclick="pickTheme('${theme}')"]`);
  if (btn) btn.classList.add('active');
}

// =============================================================================
// FULLSCREEN
// =============================================================================
function tryFullscreen() {
  try {
    const el = document.documentElement;
    const ffs = [
      el.requestFullscreen && el.requestFullscreen(),
      el.webkitRequestFullscreen && el.webkitRequestFullscreen(),
      el.mozRequestFullScreen && el.mozRequestFullScreen(),
      el.msRequestFullscreen && el.msRequestFullscreen()
    ].filter(Boolean);
    if (ffs.length) ffs[0].catch(()=>{});
  } catch(e){}
}

// =============================================================================
// DOCS
// =============================================================================
function initDocs() {
  const canvas = document.getElementById('paper-canvas');
  if (!canvas) return;
  canvas.oninput = () => { try { play('sparkle'); } catch(e) {} };
}

function formatDoc(cmd, val) {
  try {
    play('sparkle');
    document.execCommand(cmd, false, val || null);
    const sel = window.getSelection();
    if (sel && sel.anchorNode) {
      const el = sel.anchorNode.parentElement;
      if (el) sparkleAt(el);
    }
  } catch(e) {}
}

// =============================================================================
// TERMINAL
// =============================================================================
function initTerminal() {
  const hidden = document.getElementById('term-input-hidden');
  const display = document.getElementById('term-input-display');
  if (!hidden || !display) return;
  hidden.value = '';
  display.textContent = '';
  hidden.focus();
  hidden.oninput = () => {
    display.textContent = hidden.value;
    try { play('sparkle'); } catch(e) {}
    sparkleBurst(window.innerWidth/2, window.innerHeight/2, 4);
  };
  hidden.onkeydown = (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const cmd = hidden.value.trim();
      hidden.value = '';
      display.textContent = '';
      if (!cmd) return;
      try { play('enter'); } catch(e) {}
      addTermLine('❯ ' + cmd, 't-cmd');
      runCmd(cmd, true);
      sparkleBurst(window.innerWidth/2, window.innerHeight/2, 15);
    } else if (e.key === 'Escape') {
      hidden.value = '';
      display.textContent = '';
    }
  };
  // Click on terminal to focus input
  const output = document.getElementById('term-output');
  if (output) output.onclick = () => hidden.focus();
}

function tryEnterTerminal() {
  addTermLine('Type a command or tap a card below!', 'term-idle');
}

function addTermLine(text, cls = 't-ok') {
  const out = document.getElementById('term-output');
  if (!out) return;
  // Remove idle prompt
  const idle = out.querySelector('.term-idle');
  if (idle) idle.remove();
  const d = document.createElement('div');
  d.className = 'term-line ' + cls;
  d.textContent = text;
  out.appendChild(d);
  out.scrollTop = out.scrollHeight;
}

const COMMANDS = {
  ping: () => { addTermLine('Pinging google.com... 64bytes: time=12ms'); setTimeout(()=>addTermLine('64bytes from google.com: seq=1 ttl=64'),600); setTimeout(()=>addTermLine('--- google.com ping stats ---'),1200); setTimeout(()=>addTermLine('1 packets transmitted, 1 received, 0% packet loss'),1300); },
  deploy: () => { addTermLine('Deploying to production...'); ['Compiling assets...','Uploading files...','Restarting servers...','✅ Deployed!'].forEach((m,i)=>setTimeout(()=>addTermLine(m),i*500)); },
  backup: () => { addTermLine('Starting backup...'); ['✔ Saved: database.sql','✔ Saved: config.json','✔ Saved: uploads/'].forEach((m,i)=>setTimeout(()=>addTermLine(m,'t-ok'),i*400)); },
  neofetch: () => {
    const now = new Date();
    addTermLine('        _____  ', 't-cmd');
    addTermLine('       /     \\ ', 't-cmd');
    addTermLine('      | () () | ', 't-cmd');
    addTermLine('       \\  ^  /  ', 't-cmd');
    addTermLine('        |||||   ', 't-cmd');
    addTermLine('   OS: ClicketyOS 1.0', 't-ok');
    addTermLine('   User: little-hacker', 't-ok');
    addTermLine('   Time: ' + now.toLocaleTimeString(), 't-ok');
  },
  colorbomb: () => {
    addTermLine('💥 BOOM! BOOM! BOOM! 💥', 't-ok');
    for (let i = 0; i < 80; i++) {
      setTimeout(() => {
        sparkleBurst(Math.random()*window.innerWidth, Math.random()*window.innerHeight*0.6, 5);
        const emojis = ['🎉','⭐','💖','🌟','🎊','✨','💫','🔥'];
        emojiBurst(Math.random()*window.innerWidth, Math.random()*window.innerHeight*0.5, emojis[Math.floor(Math.random()*emojis.length)]);
      }, i * 40);
    }
    setTimeout(() => confettiBurst(), 200);
  },
  matrix: () => {
    addTermLine('Initiating matrix protocol...', 't-ok');
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*';
    let count = 0;
    const iv = setInterval(() => {
      addTermLine(Array.from({length:40},(_,i)=>chars[Math.floor(Math.random()*chars.length)]).join(''), 't-cmd');
      count++;
      if (count > 12) { clearInterval(iv); addTermLine('Matrix complete. You are the one.', 't-ok'); }
    }, 200);
  },
  hack: () => {
    addTermLine('Hacking the mainframe...', 't-ok');
    setTimeout(()=>addTermLine('Bypassing firewall...', 't-cmd'),300);
    setTimeout(()=>addTermLine('Injecting payload...', 't-cmd'),700);
    setTimeout(()=>addTermLine('Root access GRANTED!', 't-ok'),1100);
    setTimeout(()=>confettiBurst(),1300);
  },
  virus: () => {
    addTermLine('⚠️ WARNING: Virus detected!', 't-err');
    setTimeout(()=>addTermLine('Scanning...  ██████████ 100%', 't-cmd'),400);
    setTimeout(()=>addTermLine('Virus removed! System clean.', 't-ok'),900);
    setTimeout(()=>{ try{play('happy');}catch(e){} },1000);
  }
};

function runCmd(cmd, fromTyping = false) {
  const c = cmd.toLowerCase().trim();
  if (COMMANDS[c]) {
    try { play('happy'); } catch(e) {}
    if (!fromTyping) { addTermLine('❯ ' + cmd, 't-cmd'); }
    COMMANDS[c]();
  } else if (c) {
    try { play('err'); } catch(e) {}
    addTermLine('Command not found: ' + cmd + ' — try ping, deploy, hack, virus!', 't-err');
  }
}

// =============================================================================
// MEET
// =============================================================================
let micOn = false, camOn = false, handUp = false;

function initCall() {
  try { play('happy'); } catch(e) {}
  sparkleBurst(window.innerWidth/2, window.innerHeight/2, 25);
  confettiBurst();
  // Cycle speaking tile
  const tiles = document.querySelectorAll('.meet-tile');
  if (tiles.length) {
    let idx = 0;
    setInterval(() => {
      tiles.forEach(t => t.classList.remove('speaking'));
      tiles[idx % tiles.length].classList.add('speaking');
      idx++;
    }, 2200);
  }
}

function reactEmoji(emoji) {
  try { play('happy'); sparkleBurst(window.innerWidth/2, window.innerHeight/2, 15); confettiBurst(); } catch(e) {}
  const emojis = ['🎉','⭐','💖','🌟','🎊'];
  for (let i = 0; i < 5; i++) {
    setTimeout(() => {
      emojiBurst(
        window.innerWidth * (0.2 + Math.random()*0.6),
        window.innerHeight * (0.3 + Math.random()*0.4),
        emojis[Math.floor(Math.random()*emojis.length)]
      );
    }, i * 100);
  }
}

function toggleMic() {
  micOn = !micOn;
  try { play('snap'); } catch(e) {}
  const btn = document.getElementById('mic-btn');
  if (btn) { btn.classList.toggle('on', micOn); btn.style.background = micOn ? '#27c93f' : '#3d3d3d'; }
  sparkleAt(btn);
}

function toggleCam() {
  camOn = !camOn;
  try { play('sparkle'); } catch(e) {}
  const btn = document.getElementById('cam-btn');
  if (btn) { btn.classList.toggle('on', camOn); btn.style.background = camOn ? '#27c93f' : '#3d3d3d'; }
  sparkleAt(btn);
}

function toggleHand() {
  handUp = !handUp;
  try { play('enter'); } catch(e) {}
  const btn = document.querySelector('.ctrl-btn.hand');
  if (btn) { btn.classList.toggle('on', handUp); btn.style.background = handUp ? '#f0ad4e' : '#3d3d3d'; }
  sparkleAt(btn);
}

function doSparkle() {
  try { play('sparkle'); } catch(e) {}
  sparkleBurst(window.innerWidth/2, window.innerHeight/2, 30);
}

// =============================================================================
// HOME SCREEN — build stars + floating icons
// =============================================================================
(function buildHome() {
  // Stars
  const starsEl = document.getElementById('home-stars');
  if (starsEl) {
    for (let i = 0; i < 60; i++) {
      const s = document.createElement('div');
      s.className = 'home-star';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDelay = Math.random() * 3 + 's';
      starsEl.appendChild(s);
    }
  }
  // Floating icons
  const home = document.getElementById('home-screen');
  if (home) {
    const icons = [['📝', '10%', '15%'], ['💻', '75%', '20%'], ['📹', '15%', '70%'], ['⌨️', '70%', '65%']];
    icons.forEach(([emoji, l, t]) => {
      const el = document.createElement('div');
      el.className = 'home-float';
      el.textContent = emoji;
      el.style.cssText = `left:${l};top:${t};font-size:52px;opacity:.4`;
      el.style.animationDelay = Math.random() * 4 + 's';
      home.appendChild(el);
    });
  }
})();

// =============================================================================
// INIT — auto-start Terminal after 500ms
// =============================================================================
setTimeout(() => {
  doEnter();
}, 500);
