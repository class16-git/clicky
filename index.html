<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Clickety Terminal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --fg: #c9d1d9;
      --teal: #4ECDC4;
      --coral: #FF6B6B;
      --yellow: #FFE66D;
      --green: #6BCB77;
      --purple: #A855F7;
      --dim: rgba(201,209,217,0.5);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      background: var(--bg);
      color: var(--fg);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ===== BOOT SEQUENCE ===== */
    #boot {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 900;
      padding: 24px 20px;
      font-size: 13px;
      line-height: 1.7;
      color: var(--teal);
      overflow: hidden;
    }
    #boot .line {
      opacity: 0;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #boot .line.show { opacity: 1; }
    #boot .green { color: var(--green); }
    #boot .yellow { color: var(--yellow); }
    #boot .coral { color: var(--coral); }
    #boot .dim { color: rgba(78,205,196,0.35); }
    #boot .bold { font-weight: bold; }
    #boot .ascii {
      color: var(--teal);
      font-size: 11px;
      line-height: 1.15;
    }
    #boot .big { font-size: 16px; }

    /* ===== TERMINAL ===== */
    #terminal {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 8px 12px 0;
    }

    /* ASCII header */
    .header-art {
      text-align: center;
      color: var(--teal);
      font-size: 9px;
      line-height: 1.15;
      white-space: pre;
      padding: 4px 0 8px;
      opacity: 0.6;
      flex-shrink: 0;
      letter-spacing: 0;
    }

    /* Main window */
    .window {
      flex: 1;
      background: #161b22;
      border: 1px solid rgba(78,205,196,0.15);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .win-header {
      padding: 6px 12px;
      background: rgba(78,205,196,0.05);
      border-bottom: 1px solid rgba(78,205,196,0.1);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .win-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .win-title {
      margin-left: 6px;
      font-size: 11px;
      color: rgba(201,209,217,0.4);
    }

    .output {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.6;
      scrollbar-width: thin;
      scrollbar-color: rgba(78,205,196,0.3) transparent;
    }
    .output::-webkit-scrollbar { width: 5px; }
    .output::-webkit-scrollbar-thumb { background: rgba(78,205,196,0.3); border-radius: 3px; }

    .line { white-space: pre-wrap; word-break: break-all; }
    .l-cmd   { color: var(--teal); }
    .l-cmd::before { content: '> '; color: rgba(78,205,196,0.35); }
    .l-out   { color: var(--fg); }
    .l-ok    { color: var(--green); }
    .l-err   { color: var(--coral); }
    .l-warn  { color: var(--yellow); }
    .l-sys   { color: rgba(78,205,196,0.45); font-style: italic; }
    .l-ascii { color: var(--teal); font-size: 10px; line-height: 1.15; white-space: pre; }
    .l-big   { font-size: 15px; }
    .l-dim   { color: rgba(201,209,217,0.3); }
    .l-purple { color: var(--purple); }
    .l-highlight { color: var(--yellow); }

    /* Input row */
    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-top: 1px solid rgba(78,205,196,0.08);
      flex-shrink: 0;
    }
    .prompt-symbol {
      color: var(--teal);
      font-size: 13px;
      white-space: nowrap;
      user-select: none;
    }
    .input-display {
      flex: 1;
      color: #e6edf3;
      font-size: 13px;
      min-height: 20px;
      white-space: pre-wrap;
      word-break: break-all;
      outline: none;
    }
    .cursor-blink {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: var(--teal);
      animation: blink 1s step-end infinite;
      vertical-align: middle;
      flex-shrink: 0;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* Hint bar */
    .hint-bar {
      text-align: center;
      padding: 5px;
      font-size: 10px;
      color: rgba(78,205,196,0.25);
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    /* Network nodes */
    .network-panel {
      display: flex;
      gap: 6px;
      padding: 6px 14px;
      justify-content: center;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .net-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .net-icon {
      width: 32px;
      height: 32px;
      border-radius: 5px;
      background: rgba(78,205,196,0.05);
      border: 1px solid rgba(78,205,196,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.3s ease;
    }
    .net-icon.on  { background: var(--teal); box-shadow: 0 0 12px rgba(78,205,196,0.5); border-color: var(--teal); }
    .net-icon.warn { background: var(--yellow); box-shadow: 0 0 12px rgba(255,230,109,0.5); border-color: var(--yellow); }
    .net-icon.off  { opacity: 0.2; }
    .net-label { font-size: 8px; color: rgba(78,205,196,0.3); font-family: 'Courier New', monospace; }

    /* Progress bar */
    .progress-wrap {
      margin: 0 14px 6px;
      height: 3px;
      background: rgba(78,205,196,0.08);
      border-radius: 2px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--teal), var(--green));
      border-radius: 2px;
      transition: width 0.3s ease;
      width: 0%;
    }

    /* ===== CELEBRATION ===== */
    .celebration {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
    }
    .star {
      position: absolute;
      font-size: 20px;
      animation: starBurst 1s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }
    @keyframes starBurst {
      0% { transform: scale(0) rotate(0deg); opacity: 1; }
      100% { transform: scale(1) rotate(720deg) translateY(-250px); opacity: 0; }
    }

    /* Screen shake */
    .shake { animation: shake 0.3s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px) rotate(-1deg); }
      75% { transform: translateX(5px) rotate(1deg); }
    }

    /* Emoji rain */
    .emoji-rain span {
      position: fixed;
      font-size: 24px;
      animation: emojiFall 1.8s ease forwards;
    }
    @keyframes emojiFall {
      0%   { transform: translateY(-60px) rotate(0deg) scale(0); opacity: 0; }
      15%  { transform: translateY(10vh) rotate(20deg) scale(1.2); opacity: 1; }
      85%  { opacity: 1; }
      100% { transform: translateY(105vh) rotate(360deg) scale(0.5); opacity: 0; }
    }

    /* Parent panel */
    #parent-trigger {
      position: fixed;
      top: 0; right: 0;
      width: 60px; height: 60px;
      z-index: 200;
      opacity: 0;
    }
    #parent-panel {
      position: fixed;
      top: 0; right: 0;
      background: rgba(13,17,23,0.97);
      backdrop-filter: blur(20px);
      border-radius: 0 0 16px 16px;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 8px;
      z-index: 150;
      min-width: 170px;
      border: 1px solid rgba(78,205,196,0.2);
    }
    #parent-panel.open { display: flex; }
    .parent-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(78,205,196,0.08);
      border: 1px solid rgba(78,205,196,0.15);
      border-radius: 10px;
      color: var(--teal);
      font-size: 13px;
      cursor: pointer;
      font-family: 'Courier New', Courier, monospace;
      transition: background 0.2s;
    }
    .parent-btn:hover { background: rgba(78,205,196,0.15); }
    .parent-btn span { font-size: 16px; }
  </style>
</head>
<body>
  <!-- Boot sequence -->
  <div id="boot"></div>

  <!-- Main app -->
  <div id="app">

    <!-- Terminal -->
    <div id="terminal">
      <div class="header-art" id="header-art"></div>

      <div class="window">
        <div class="win-header">
          <div class="win-dot" style="background:#FF5F57"></div>
          <div class="win-dot" style="background:#FFBD2E"></div>
          <div class="win-dot" style="background:#27C93F"></div>
          <span class="win-title">IT Operations Terminal v2.0</span>
        </div>
        <div class="output" id="output"></div>
        <div class="input-row">
          <span class="prompt-symbol">&gt;</span>
          <div class="input-display" id="input-display" contenteditable="true" spellcheck="false" autocomplete="off"></div>
          <span class="cursor-blink"></span>
        </div>
      </div>

      <div class="progress-wrap">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <div class="network-panel" id="network-panel"></div>

      <div class="hint-bar" id="hint-bar">
        ENTER: run &nbsp;|&nbsp; BACKSPACE: delete &nbsp;|&nbsp; SMASH KEYS: chaos mode
      </div>
    </div>

    <!-- Celebration -->
    <div id="celebration" class="celebration"></div>
    <div id="emoji-rain" class="emoji-rain"></div>

    <!-- Parent panel -->
    <div id="parent-trigger"></div>
    <div id="parent-panel">
      <button class="parent-btn" id="btn-sound"><span>🔊</span> Sound On</button>
      <button class="parent-btn" id="btn-reset"><span>🔄</span> Reset Terminal</button>
      <button class="parent-btn" id="btn-fullscreen"><span>📺</span> Fullscreen</button>
    </div>
  </div>

  <script>
    // ===== STATE =====
    const state = {
      soundEnabled: true,
      reducedMotion: false,
      keyTimes: [],
      parentTapCount: 0,
      parentTapTimer: null,
      parentPanelOpen: false,
      networkLevel: 0,     // 0-6
      progress: 0,         // 0-100
      cmdHistory: [],
      bootDone: false
    };

    const MAX_NETWORK = 6;

    const NET_NODES = [
      { icon: '🖥️', label: 'SERVER' },
      { icon: '🖧', label: 'SWITCH' },
      { icon: '📡', label: 'WIFI' },
      { icon: '🗄️', label: 'STORAGE' },
      { icon: '🔌', label: 'POWER' },
      { icon: '📦', label: 'BACKUP' }
    ];

    // ===== SOUND =====
    const sound = {
      ctx: null,
      init() {
        if (this.ctx) return;
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      },
      play(type) {
        if (!state.soundEnabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        switch (type) {
          case 'key':
            osc.frequency.value = 600 + Math.random() * 400;
            osc.type = 'square';
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
            break;
          case 'enter':
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.linearRampToValueAtTime(800, now + 0.08);
            osc.type = 'square';
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.08);
            osc.start(now); osc.stop(now + 0.08);
            break;
          case 'ok':
            [523, 659, 784].forEach((f, i) => {
              const o = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              o.connect(g); g.connect(this.ctx.destination);
              o.frequency.value = f; o.type = 'sine';
              g.gain.setValueAtTime(0.12, now + i * 0.12);
              g.gain.linearRampToValueAtTime(0, now + i * 0.12 + 0.25);
              o.start(now + i * 0.12); o.stop(now + i * 0.12 + 0.25);
            });
            return;
          case 'error':
            osc.frequency.value = 200;
            osc.type = 'sawtooth';
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
            break;
          case 'boot':
            osc.frequency.value = 330;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.04);
            osc.start(now); osc.stop(now + 0.04);
            break;
          case 'chaos':
            for (let i = 0; i < 3; i++) {
              const o = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              o.connect(g); g.connect(this.ctx.destination);
              o.frequency.value = [880, 440, 660][i];
              o.type = 'square';
              g.gain.setValueAtTime(0.06, now + i * 0.05);
              g.gain.linearRampToValueAtTime(0, now + i * 0.05 + 0.05);
              o.start(now + i * 0.05); o.stop(now + i * 0.05 + 0.05);
            }
            break;
        }
      }
    };

    // ===== UTILITIES =====
    function $(id) { return document.getElementById(id); }

    function isSmash() {
      const now = Date.now();
      state.keyTimes.push(now);
      state.keyTimes = state.keyTimes.filter(t => now - t < 400);
      return state.keyTimes.length > 5;
    }

    function addLine(text, cls) {
      const out = $('output');
      const div = document.createElement('div');
      div.className = 'line ' + (cls || '');
      div.textContent = text;
      out.appendChild(div);
      out.scrollTop = out.scrollHeight;
    }

    function addLines(pairs) {
      pairs.forEach(([text, cls]) => addLine(text, cls));
    }

    function setProgress(pct) {
      state.progress = pct;
      $('progress-fill').style.width = pct + '%';
    }

    function setNetwork(level) {
      state.networkLevel = Math.min(MAX_NETWORK, Math.max(0, level));
      const panel = $('network-panel');
      panel.innerHTML = NET_NODES.map((n, i) =>
        `<div class="net-node">
          <div class="net-icon ${i < state.networkLevel ? 'on' : 'off'}">${n.icon}</div>
          <div class="net-label">${n.label}</div>
        </div>`
      ).join('');
    }

    function addProgress(delta) {
      setProgress(Math.min(100, state.progress + delta));
    }

    function celebrate() {
      if (state.reducedMotion) return;
      const el = $('celebration');
      el.innerHTML = '';
      const emojis = ['⭐','✨','💫','🌟','🎉'];
      for (let i = 0; i < 20; i++) {
        const s = document.createElement('span');
        s.className = 'star';
        s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 60 + 20 + '%';
        s.style.animationDelay = Math.random() * 0.5 + 's';
        el.appendChild(s);
      }
      setTimeout(() => el.innerHTML = '', 2000);
    }

    function emojiRain() {
      if (state.reducedMotion) return;
      const el = $('emoji-rain');
      el.innerHTML = '';
      const emojis = ['😊','🎉','👍','❤️','🔥','⭐','✨','💫'];
      for (let i = 0; i < 15; i++) {
        const s = document.createElement('span');
        s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        s.style.left = Math.random() * 100 + '%';
        s.style.animationDelay = Math.random() * 0.8 + 's';
        el.appendChild(s);
      }
      setTimeout(() => el.innerHTML = '', 2500);
    }

    function shake() {
      if (state.reducedMotion) return;
      $('app').classList.add('shake');
      setTimeout(() => $('app').classList.remove('shake'), 300);
    }

    // ===== COMMANDS =====
    const COMMANDS = {
      ping() {
        addLine('Pinging server @ 192.168.1.1...', 'l-sys');
        setTimeout(() => {
          addLine('Reply from 192.168.1.1: time=2ms', 'l-out');
          addLine('🟢 PONG! Server is alive!', 'l-ok l-big');
          addProgress(15);
          setNetwork(Math.max(state.networkLevel, 1));
          sound.play('ok');
        }, 500);
      },

      deploy() {
        addLine('Initializing deployment pipeline...', 'l-sys');
        const steps = [
          ['Compiling assets...', 'l-sys', 300],
          ['Uploading to CDN...', 'l-sys', 600],
          ['Running health checks...', 'l-sys', 900],
          ['Updating load balancer...', 'l-sys', 1200],
          ['🚀 DEPLOY SUCCESSFUL!', 'l-ok l-big', 1500],
          ['Version 2.0 LIVE on production', 'l-out', 1500],
        ];
        steps.forEach(([text, cls, delay]) => {
          setTimeout(() => { addLine(text, cls); sound.play('key'); addProgress(20); }, delay);
        });
        setTimeout(() => {
          setNetwork(Math.max(state.networkLevel, 3));
          celebrate();
        }, 1600);
      },

      backup() {
        addLine('Starting incremental backup...', 'l-sys');
        const files = ['📄 report_q4.xlsx', '📝 meeting_notes.md', '🗂️ config.json', '📊 dashboard.html', '📄 invoice_2026.pdf', '🗺️ network_map.png', '📄 team_roster.xlsx', '🗂️ ssl_certs.tar'];
        let i = 0;
        const iv = setInterval(() => {
          addLine('  ✓ ' + files[i % files.length] + ' → 🗄️ archive', 'l-out');
          sound.play('key');
          addProgress(10);
          i++;
          if (i >= files.length) {
            clearInterval(iv);
            setTimeout(() => {
              addLine('✅ BACKUP COMPLETE — 8 files secured', 'l-ok l-big');
              addProgress(15);
              setNetwork(Math.max(state.networkLevel, 2));
              sound.play('ok');
            }, 300);
          }
        }, 280);
      },

      fix() {
        addLine('Running network diagnostics...', 'l-sys');
        const diag = [
          ['  🔍 Checking WiFi router...', 'l-sys', 300],
          ['  ⚠️  WiFi router offline', 'l-warn', 600],
          ['  🔧 Reconnecting cables...', 'l-sys', 900],
          ['  ⚡ Restoring power to switch...', 'l-sys', 1200],
          ['  📡 Reconfiguring access point...', 'l-sys', 1500],
        ];
        diag.forEach(([text, cls, delay]) => {
          setTimeout(() => addLine(text, cls), delay);
        });
        setTimeout(() => {
          addLine('✅ WiFi RESTORED — Network online!', 'l-ok l-big');
          addProgress(20);
          setNetwork(MAX_NETWORK);
          setProgress(100);
          sound.play('ok');
          celebrate();
          emojiRain();
        }, 1800);
      },

      status() {
        const net = state.networkLevel === MAX_NETWORK ? '🟢 ONLINE' : state.networkLevel > 0 ? '🟡 DEGRADED' : '🔴 OFFLINE';
        const cpu = ['▰▰▰▰▱▱▱▱▱▱','▰▰▰▰▰▰▱▱▱▱','▰▰▰▱▱▱▱▱▱▱'][Math.floor(Math.random()*3)];
        const mem = ['▰▰▰▰▱▱▱▱▱▱','▰▰▰▰▰▰▱▱▱▱'][Math.floor(Math.random()*2)];
        const disk = ['▰▰▰▰▰▱▱▱▱▱','▰▰▰▰▰▰▰▱▱▱'][Math.floor(Math.random()*2)];
        addLines([
          ['══════════ SYSTEM STATUS ══════════', 'l-sys'],
          ['  CPU     ' + cpu, 'l-out'],
          ['  Memory  ' + mem, 'l-out'],
          ['  Disk    ' + disk, 'l-out'],
          ['  Network ' + net + ' (' + state.networkLevel + '/' + MAX_NETWORK + ' nodes)', 'l-out'],
          ['  Uptime  ' + Math.floor(Math.random()*24) + 'h ' + Math.floor(Math.random()*60) + 'm', 'l-out'],
          ['  Version 2.0.0 — Build #4392', 'l-dim'],
          ['═══════════════════════════════════', 'l-sys'],
        ]);
      },

      help() {
        addLines([
          ['Available commands:', 'l-sys'],
          ['  ping     — Check if server is alive', 'l-out'],
          ['  deploy   — Deploy to production', 'l-out'],
          ['  backup   — Backup all files to archive', 'l-out'],
          ['  fix      — Fix the WiFi network', 'l-out'],
          ['  status   — Show system status', 'l-out'],
          ['  clear    — Clear the terminal', 'l-out'],
          ['  ascii    — Show ASCII art', 'l-out'],
          ['  matrix   — Enter the matrix', 'l-out'],
          ['  hack     — Fake hacking mode', 'l-out'],
          ['  virus    — Scan for viruses', 'l-out'],
          ['  restart  — Restart all services', 'l-out'],
          ['  help     — Show this message', 'l-out'],
        ]);
      },

      clear() {
        $('output').innerHTML = '';
        addLine('Terminal cleared.', 'l-sys');
      },

      ascii() {
        addLines([
          ['  ╔══════════════════════════════╗', 'l-ascii'],
          ['  ║   CLICKETY TERMINAL v2.0    ║', 'l-ascii'],
          ['  ║   Big work for little hands ║', 'l-ascii'],
          ['  ╚══════════════════════════════╝', 'l-ascii'],
        ]);
        addProgress(5);
        sound.play('ok');
      },

      matrix() {
        addLine('Entering the matrix...', 'l-sys');

        let i = 0;
        const iv = setInterval(() => {
          let line = '';
          for (let j = 0; j < 50; j++) line += chars[Math.floor(Math.random() * chars.length)];

          i++;
          if (i >= 8) {
            clearInterval(iv);
            setTimeout(() => {
              addLine('🟢 You are in the matrix.', 'l-ok l-big');
              addProgress(10);
              sound.play('ok');

          }

      },

            clearInterval(iv);
            setTimeout(() => {
              addLine('✅ THREAT CLEAN — 0 viruses found', 'l-ok l-big');
              addLine('System is secure!', 'l-sys');
              addProgress(10);
              sound.play('ok');
            }, 300);
          }
        }, 350);
      },

      restart() {
        addLine('Restarting all services...', 'l-sys');
        const services = ['nginx', 'postgresql', 'redis', 'docker', 'vault', 'app_server'];
        let i = 0;
        const iv = setInterval(() => {
          addLine('  ✓ ' + services[i % services.length] + ' restarted', 'l-out');
          sound.play('key');
          i++;
          if (i >= services.length) {
            clearInterval(iv);
            setTimeout(() => {
              addLine('✅ ALL SERVICES RESTARTED', 'l-ok l-big');
              setNetwork(MAX_NETWORK);
              setProgress(100);
              sound.play('ok');
              celebrate();
            }, 400);
          }
        }, 250);
      },

      neofetch() {
        addLines([
          ['         ▄▄▄▄▄▄▄         user@clickety', 'l-ascii'],
          ['       ▄█████████▄       OS: Clickety Terminal 2.0', 'l-ascii'],
          ['      ████████████      Host: Daddys-Computer', 'l-ascii'],
          ['     ██████████████     Kernel: H4ck3r-t0uch', 'l-ascii'],
          ['    ████████████████    Shell: kids-bash 1.0', 'l-ascii'],
          ['   █████████████████   CPU: Toddler @ 120Hz', 'l-ascii'],
          ['  ███████████████████  Memory: 256MB / 512MB', 'l-ascii'],
          ['        ████████        Uptime: 42 minutes', 'l-ascii'],
          ['', ''],
          ['  ▗▄▄▖ ▗▄▄▖ ▗▄▄▄▖ ▗▄▄▖ ▗▄▄▖', 'l-purple'],
          ['  █ ▗▄▄ █ █ █   █ █   █ █', 'l-purple'],
          ['  █   █ █ █ █   █ █▗▄▄█ █▗▄▄', 'l-purple'],

    function runCommand(raw) {
      const cmd = raw.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
      if (!cmd) return;

      if (COMMANDS[cmd]) {
        COMMANDS[cmd]();
      } else {
        addLine('Command not found: ' + cmd, 'l-err');
        addLine('Type "help" for available commands.', 'l-sys');
        sound.play('error');
        addProgress(2);
      }
    }

    // ===== CHAOS MODE (keyboard smash) =====
    function chaosMode() {
      const allCmds = Object.keys(COMMANDS);
      addLine('!!! CHAOS MODE ACTIVATED !!!', 'l-err l-big');
      sound.play('chaos');
      shake();

      let i = 0;
      const iv = setInterval(() => {
        const c = allCmds[Math.floor(Math.random() * allCmds.length)];
        addLine('> ' + c, 'l-cmd');
        COMMANDS[c]();
        i++;
        if (i >= 6) clearInterval(iv);
      }, 500);

      setTimeout(() => {
        addLine('', '');
        addLine('✅ CHAOS COMPLETE — System unstable!', 'l-ok l-big');
        setNetwork(MAX_NETWORK);
        setProgress(100);
        sound.play('chaos');
        emojiRain();
        shake();
      }, 3500);
    }

    // ===== BOOT SEQUENCE =====

      { t: '████ ████ ████ ████ ████ ████ ████ ████', c: 'ascii', d: 400 },
      { t: '████ CLICKETY TERMINAL v2.0 ████', c: 'bold green', d: 400 },
      { t: '████ Big work for little hands ████', c: 'dim', d: 500 },
      { t: '████████████████████████████████████', c: 'ascii', d: 500 },
      { t: '', c: '', d: 600 },
      { t: '[  OK  ] Starting kernel modules', c: 'green', d: 800 },
      { t: '[  OK  ] Mounting filesystems', c: 'green', d: 1000 },
      { t: '[  OK  ] Loading network drivers', c: 'green', d: 1200 },
      { t: '[ WARN ] WiFi router not responding', c: 'yellow', d: 1500 },
      { t: '[  OK  ] Starting SSH daemon', c: 'green', d: 1700 },
      { t: '[  OK  ] Initializing database', c: 'green', d: 1900 },
      { t: '[  OK  ] Starting web server', c: 'green', d: 2100 },
      { t: '[  OK  ] Loading terminal UI', c: 'green', d: 2300 },
      { t: '', c: '', d: 2500 },
      { t: '════════════════════════════════════════', c: 'dim', d: 2600 },
      { t: 'Type a command and press ENTER', c: '', d: 2700 },
      { t: 'Try: ping, deploy, backup, fix, status, help', c: 'dim', d: 2800 },
      { t: '════════════════════════════════════════', c: 'dim', d: 2900 },
    ];

    function runBoot() {
      const boot = $('boot');
      BOOT_LINES.forEach(({ t, c, d }) => {
        setTimeout(() => {
          if (!t) {
            boot.appendChild(document.createElement('div'));
            return;
          }
          const div = document.createElement('div');
          div.className = 'line ' + c;
          div.textContent = t;
          boot.appendChild(div);
          sound.play('boot');
          // Scroll to bottom
          boot.scrollTop = boot.scrollHeight;
        }, d);
      });

      // After boot: fade out boot, show terminal
      setTimeout(() => {
        boot.style.transition = 'opacity 0.8s ease';
        boot.style.opacity = '0';
        setTimeout(() => {
          boot.style.display = 'none';
          state.bootDone = true;
          // Focus input
          const inp = $('input-display');
          if (inp) {
            inp.focus();
            // Place cursor at end
            const range = document.createRange();
            const sel = window.getSelection();
            range.selectNodeContents(inp);
            range.collapse(false);
            sel.removeAllRanges();
            sel.addRange(range);
          }
          // Auto-fullscreen
          if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
          }
        }, 800);
      }, 3200);
    }

    // ===== INPUT HANDLING =====
    let currentInput = '';

    function handleEnter() {
      const cmd = currentInput;
      currentInput = '';
      $('input-display').textContent = '';
      addLine(cmd, 'l-cmd');
      runCommand(cmd);
      state.cmdHistory.unshift(cmd);
      if (state.cmdHistory.length > 20) state.cmdHistory.pop();
      sound.play('enter');
    }

    function initInput() {
      const inp = $('input-display');
      if (!inp) return;

      inp.addEventListener('keydown', e => {
        if (!state.bootDone) return;
        sound.init();

        if (e.key === 'Enter') {
          e.preventDefault();
          handleEnter();
          return;
        }

        if (isSmash()) {
          chaosMode();
          currentInput = '';
          inp.textContent = '';
          return;
        }

        if (e.key === 'Backspace') {
          // Let browser handle backspace naturally
          return;
        }

        if (e.key.length === 1) {
          sound.play('key');
          addProgress(1);
          // Light up a network node occasionally
          if (Math.random() < 0.1 && state.networkLevel < MAX_NETWORK) {
            setNetwork(state.networkLevel + 1);
          }
        }
      });

      inp.addEventListener('input', e => {
        currentInput = inp.textContent || '';
      });

      // Click anywhere to focus
      document.addEventListener('click', () => {
        if (state.bootDone) inp.focus();
      });
    }

    // ===== PARENT MODE =====
    function initParentMode() {
      const trigger = $('parent-trigger');
      let count = 0;
      let timer = null;

      trigger.addEventListener('click', () => {
        count++;
        clearTimeout(timer);
        timer = setTimeout(() => count = 0, 800);
        if (count >= 3) {
          state.parentPanelOpen = !state.parentPanelOpen;
          $('parent-panel').classList.toggle('open', state.parentPanelOpen);
          count = 0;
        }
      });

      document.addEventListener('click', e => {
        if (state.parentPanelOpen && !e.target.closest('#parent-panel') && !e.target.closest('#parent-trigger')) {
          state.parentPanelOpen = false;
          $('parent-panel').classList.remove('open');
        }
      });

      $('btn-sound').addEventListener('click', () => {
        state.soundEnabled = !state.soundEnabled;
        $('btn-sound').innerHTML = '<span>' + (state.soundEnabled ? '🔊' : '🔇') + '</span> Sound ' + (state.soundEnabled ? 'On' : 'Off');
        sound.init();
        if (state.soundEnabled) sound.play('key');
      });

      $('btn-reset').addEventListener('click', () => {
        $('output').innerHTML = '';
        setProgress(0);
        setNetwork(0);
        addLine('Terminal reset.', 'l-sys');
        addLine('Type "help" for available commands.', 'l-sys');
        state.parentPanelOpen = false;
        $('parent-panel').classList.remove('open');
        sound.play('ok');
      });

      $('btn-fullscreen').addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen();
        }
      });
    }

    // Block Escape from exiting fullscreen
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && document.fullscreenElement) {
        e.preventDefault();
      }
    });

    // ===== REDUCED MOTION =====
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      state.reducedMotion = true;
    }

▒██▀▀█▄    ░ ▐██▓░░██▄▄▄▄██ ▓██▒  ▐▌██▒░█░ █ ░█ ▒▓█  ▄ ▒██▀▀█▄
░██▓ ▒██▒  ░ ██▒▓░ ▓█   ▓██▒▒██░   ▓██░░░██▒██▓ ▒▒████▒░██▓ ▒██▒
░ ▒▓ ░▒▓░   ██▒▒▒  ▒▒   ▓▒█░░ ▒░   ▒ ▒ ░ ▓░▒ ▒  ░░ ▒░ ░░ ▒▓ ░▒▓░

    // ===== INIT =====
    function init() {
      initHeaderArt();
      initInput();
      initParentMode();
      runBoot();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
