<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Clickety Desk</title>
<style>
/* === RESET === */
*{box-sizing:border-box;margin:0;padding:0}
body{overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}

/* === HOMEPAGE === */
#home-screen{
  position:fixed;inset:0;z-index:100;
  background:radial-gradient(ellipse at 50% 30%,#1a1040 0%,#0a061e 60%,#050310 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  font-family:system-ui,-apple-system,sans-serif;
}
.stars{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:twink 2s infinite}
@keyframes twink{0%,100%{opacity:.3}50%{opacity:1}}
.aurora{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(100,60,200,.15) 0%,transparent 60%),radial-gradient(ellipse at 30% 100%,rgba(60,120,200,.1) 0%,transparent 50%);pointer-events:none}
.home-badge{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  border-radius:50px;padding:8px 20px;font-size:14px;color:rgba(255,255,255,.7);
  backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;
}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.home-title{font-size:clamp(28px,7vw,52px);font-weight:800;color:#fff;text-align:center;letter-spacing:-1px}
.home-sub{font-size:16px;color:rgba(255,255,255,.5);text-align:center}
.home-kbd{font-size:80px;margin:8px 0}
.home-btn{
  background:linear-gradient(135deg,#ff6b6b,#ff8c42);border:none;border-radius:16px;
  color:#fff;font-size:clamp(18px,5vw,24px);font-weight:700;padding:18px 48px;
  cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  box-shadow:0 8px 32px rgba(255,107,107,.4);transition:transform .1s;
  min-width:min(340px,90vw);min-height:72px;letter-spacing:.5px;
}
.home-btn:active{transform:scale(.96)}
.home-pills{display:flex;gap:10px}
.pill{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  border-radius:50px;padding:8px 18px;font-size:13px;color:rgba(255,255,255,.6);cursor:pointer;
  transition:all .2s;min-height:44px;display:flex;align-items:center;gap:6px;
}
.pill.active{background:rgba(79,195,247,.2);border-color:#4fc3f7;color:#4fc3f7}
.home-footer{font-size:12px;color:rgba(255,255,255,.25);text-align:center}

/* === FLOATING EMOJIS === */
.float-emoji{position:fixed;font-size:28px;opacity:.6;pointer-events:none;z-index:99;
  animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
.fe1{top:12%;left:8% ;animation-delay:0s}
.fe2{top:20%;right:10%;animation-delay:1s}
.fe3{bottom:22%;left:6% ;animation-delay:2s}
.fe4{bottom:14%;right:8% ;animation-delay:.5s}

/* === CHROME FRAME === */
#chrome-frame{
  position:fixed;inset:0;z-index:50;
  display:flex;flex-direction:column;pointer-events:none;
}
#chrome-frame.visible{pointer-events:auto}
.chrome-top{
  display:flex;align-items:center;padding:0 12px;height:44px;
  background:rgba(30,30,35,.95);border-bottom:1px solid rgba(255,255,255,.08);
  gap:0;flex-shrink:0;
}
.chrome-tab{
  display:flex;align-items:center;gap:8px;padding:0 18px;height:100%;cursor:pointer;
  font-size:13px;color:rgba(255,255,255,.5);border:none;background:none;
  min-width:100px;max-width:140px;flex:1;justify-content:center;
  transition:all .15s;position:relative;min-height:44px;
}
.chrome-tab.active{color:#fff;background:rgba(255,255,255,.06)}
.chrome-tab.active::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:#4fc3f7;
}
.chrome-dots{display:flex;gap:5px;padding:0 4px}
.cdot{width:10px;height:10px;border-radius:50%}
.cdot-r{background:#ff5f57}
.cdot-y{background:#febc2e}
.cdot-g{background:#28c840}

.chrome-workspace{flex:1;overflow:hidden;position:relative;background:#fff}

/* === WORLD PANELS === */
.world{display:none;position:absolute;inset:0;overflow:hidden}
.world.active{display:block}

/* === BOTTOM DOCK === */
.chrome-dock{
  display:flex;justify-content:center;align-items:center;padding:6px;
  background:rgba(30,30,35,.95);border-top:1px solid rgba(255,255,255,.08);
  flex-shrink:0;gap:6px;
}
.bar-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:56px;height:56px;border-radius:12px;cursor:pointer;border:none;
  background:rgba(255,255,255,.05);transition:all .2s;min-height:44px;min-width:44px;
}
.bar-btn.active{background:rgba(79,195,247,.15)}
.bar-icon{font-size:22px;line-height:1}
.bar-label{font-size:9px;color:rgba(255,255,255,.5);margin-top:2px}
.bar-btn.active .bar-label{color:#4fc3f7}

/* === DOCS WORLD === */
#paper-world{background:#fff;font-family:Georgia,serif}
.docs-toolbar{
  display:flex;gap:6px;padding:10px 14px;background:#f4f4f5;border-bottom:1px solid #e4e4e7;
  flex-shrink:0;flex-wrap:wrap;
}
.docs-btn{
  background:#fff;border:1px solid #d4d4d8;color:#444;padding:6px 12px;
  border-radius:6px;font-size:13px;cursor:pointer;min-height:36px;min-width:36px;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.docs-btn:hover{background:#f4f4f5}
.docs-write{
  flex:1;padding:24px;outline:none;overflow-y:auto;font-size:18px;line-height:1.8;
  color:#1a1a1a;min-height:200px;
}
.docs-write:empty::before{content:'Tap to write... ✏️';color:#d4d4d8;font-style:italic}
.docs-hint{
  position:absolute;bottom:16px;right:16px;background:#fff;color:#999;font-size:12px;
  padding:4px 10px;border-radius:20px;border:1px solid #e4e4e7;
}

/* === TERMINAL WORLD === */
#terminal-world{
  background:#0a0a0a;font-family:'Courier New',Courier,monospace;position:relative;
}
.term-grid{
  position:absolute;inset:0;background-image:
    linear-gradient(rgba(0,255,0,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,0,.04) 1px,transparent 1px);
  background-size:40px 40px;pointer-events:none;
}
.term-scanlines{
  position:absolute;inset:0;background:repeating-linear-gradient(
    0deg,rgba(0,0,0,.15) 0px,rgba(0,0,0,.15) 1px,transparent 1px,transparent 2px
  );pointer-events:none;
}
.term-header{
  display:flex;align-items:center;gap:8px;padding:10px 14px;
  background:#111;border-bottom:1px solid #1a1a1a;flex-shrink:0;
}
.term-dots{display:flex;gap:6px}
.term-logo{font-size:48px;text-align:center;padding:20px 0 10px;color:#0f0}
.term-prompt{color:#0f0;font-size:16px;padding:8px 16px;text-align:center;
  text-shadow:0 0 8px #0f0}
.term-cards{
  display:flex;flex-wrap:wrap;gap:10px;padding:12px 16px;justify-content:center;
}
.term-card{
  background:#0f0;font-size:13px;color:#000;font-weight:700;padding:10px 18px;
  border-radius:8px;cursor:pointer;min-height:44px;min-width:80px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border:2px solid transparent;transition:all .15s;
}
.term-card:hover{border-color:#0f0;background:#0a0;text-shadow:0 0 6px #0f0;color:#0f0}
.term-card-icon{font-size:18px}
.term-input-area{padding:12px 16px}
.term-display{
  background:#050505;border:1px solid #1a1a1a;border-radius:8px;padding:12px;
  min-height:100px;max-height:200px;overflow-y:auto;color:#0f0;font-size:13px;
  line-height:1.6;margin-bottom:10px;text-shadow:0 0 4px rgba(0,255,0,.5);
}
#term-input{
  width:100%;background:#111;border:1px solid #1a1a1a;color:#0f0;
  padding:10px 14px;border-radius:8px;font-size:14px;outline:none;
  font-family:'Courier New',Courier,monospace;text-shadow:0 0 4px rgba(0,255,0,.5);
}
#term-input::placeholder{color:#333}

/* === MEET WORLD === */
#call-world{background:#1a1a2e;font-family:system-ui,sans-serif;display:flex;flex-direction:column}
.meet-grid{
  flex:1;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px;
  align-content:center;
}
.meet-tile{
  background:#252540;border-radius:16px;aspect-ratio:4/3;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  position:relative;overflow:hidden;
}
.meet-avatar{font-size:48px}
.meet-name{font-size:13px;color:rgba(255,255,255,.7)}
.meet-wave{
  position:absolute;bottom:10px;right:10px;font-size:20px;
  animation:wav 1.2s ease-in-out infinite;
}
@keyframes wav{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(20deg)}}
.meet-tile.speaking{box-shadow:0 0 0 3px #4ade80}
.live-badge{
  position:absolute;top:10px;left:10px;background:#ef4444;color:#fff;
  font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px;letter-spacing:.5px;
}
.meet-controls{
  display:flex;justify-content:center;gap:10px;padding:14px;
  background:#111;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0;
}
.meet-btn{
  width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:22px;
  transition:all .15s;min-height:44px;min-width:44px;
}
.meet-btn.mute{background:#333;color:#fff}
.meet-btn.mute.on{background:#ef4444;color:#fff}
.meet-btn.cam{background:#333;color:#fff}
.meet-btn.cam.on{background:#333;color:#4ade80}
.meet-btn.share{background:#333;color:#fff}
.meet-btn.hand{background:#333;color:#fff}
.meet-btn.hand.on{background:#f59e0b;color:#fff;animation:pulse 1.5s infinite}
.meet-reactions{
  display:flex;justify-content:center;gap:8px;padding:8px;
  background:#0e0e1a;flex-shrink:0;flex-wrap:wrap;
}
.react-btn{
  font-size:28px;cursor:pointer;border:none;background:none;padding:4px;
  border-radius:8px;transition:transform .1s;min-height:44px;min-width:44px;
  display:flex;align-items:center;justify-content:center;
}
.react-btn:hover{transform:scale(1.3);background:rgba(255,255,255,.1)}

/* === CONFETTI === */
#confetti-container{position:fixed;inset:0;pointer-events:none;z-index:200}

/* === SPARKLES === */
.sparkle{position:fixed;pointer-events:none;z-index:300;font-size:20px;
  animation:spk 1s forwards}
@keyframes spk{0%{transform:scale(1) translateY(0);opacity:1}100%{transform:scale(0) translateY(-60px);opacity:0}}

/* === REDUCED MOTION === */
@media(prefers-reduced-motion:reduce){
  .star,.aurora,.float-emoji,.meet-wave,.pulse,*{animation:none!important;transition:none!important}
}

/* === Z-INDEX STACK === */
#home-screen{z-index:100}
#chrome-frame{z-index:50}
.world.active{z-index:10}
#confetti-container{z-index:200}
</style>
</head>
<body>

<!-- ===================== HOMEPAGE ===================== -->
<div id="home-screen">
  <div class="stars" id="stars"></div>
  <div class="aurora"></div>
  <span class="float-emoji fe1">📝</span>
  <span class="float-emoji fe2">📊</span>
  <span class="float-emoji fe3">💻</span>
  <span class="float-emoji fe4">💼</span>

  <div class="home-badge"><span class="dot"></span> 1,000+ little workers right now!</div>
  <div class="home-kbd">⌨️</div>
  <h1 class="home-title">Clickety Desk</h1>
  <p class="home-sub">Like Daddy's computer! ⌨️</p>
  <button class="home-btn" id="home-enter-btn">START WORKING! ⌨️ ✨</button>
  <div class="home-pills">
    <div class="pill active" id="pill-chrome">Chrome 👀</div>
    <div class="pill" id="pill-space">Space 🌌</div>
  </div>
  <p class="home-footer">No account. Just pretend.</p>
</div>

<!-- ===================== CHROME FRAME ===================== -->
<div id="chrome-frame">
  <!-- TOP BAR -->
  <div class="chrome-top">
    <div class="chrome-dots">
      <div class="cdot cdot-r"></div>
      <div class="cdot cdot-y"></div>
      <div class="cdot cdot-g"></div>
    </div>
    <button class="chrome-tab active" id="tab-paper" data-w="paper">📄 Docs</button>
    <button class="chrome-tab" id="tab-terminal" data-w="terminal">💻 Terminal</button>
    <button class="chrome-tab" id="tab-call" data-w="call">📹 Meet</button>
  </div>
  <!-- WORKSPACE -->
  <div class="chrome-workspace">

    <!-- ===== DOCS WORLD ===== -->
    <div id="paper-world" class="world active">
      <div class="docs-toolbar">
        <button class="docs-btn" id="btn-bold"><b>B</b></button>
        <button class="docs-btn" id="btn-italic"><i>I</i></button>
        <button class="docs-btn" id="btn-red" style="color:#ef4444">A</button>
        <button class="docs-btn" id="btn-green" style="color:#22c55e">A</button>
        <button class="docs-btn" id="btn-blue" style="color:#3b82f6">A</button>
        <button class="docs-btn" id="btn-size">T+</button>
      </div>
      <div class="docs-write" id="docs-area" contenteditable="true" spellcheck="false"></div>
      <div class="docs-hint">Tap to write... ✏️</div>
    </div>

    <!-- ===== TERMINAL WORLD ===== -->
    <div id="terminal-world" class="world">
      <div class="term-grid"></div>
      <div class="term-scanlines"></div>
      <div class="term-logo">💻</div>
      <div class="term-prompt">root@clickety:~$</div>
      <div class="term-cards" id="term-cards"></div>
      <div class="term-input-area">
        <div class="term-display" id="term-display"></div>
        <input id="term-input" type="text" placeholder="type a command..." autocomplete="off" spellcheck="false">
      </div>
    </div>

    <!-- ===== MEET WORLD ===== -->
    <div id="call-world" class="world">
      <div class="live-badge">📹 LIVE</div>
      <div class="meet-grid">
        <div class="meet-tile" id="tile-0">
          <div class="meet-avatar">👩</div>
          <div class="meet-name">Mama</div>
          <div class="meet-wave">👋</div>
        </div>
        <div class="meet-tile" id="tile-1">
          <div class="meet-avatar">👧</div>
          <div class="meet-name">Aya</div>
        </div>
        <div class="meet-tile" id="tile-2">
          <div class="meet-avatar">👦</div>
          <div class="meet-name">Fadi</div>
        </div>
        <div class="meet-tile" id="tile-3">
          <div class="meet-avatar">🧔</div>
          <div class="meet-name">Papa</div>
          <div class="meet-wave">👋</div>
        </div>
      </div>
      <div class="meet-controls">
        <button class="meet-btn mute" id="btn-mute">🎤</button>
        <button class="meet-btn cam" id="btn-cam">📹</button>
        <button class="meet-btn share" id="btn-share">📤</button>
        <button class="meet-btn hand" id="btn-hand">✋</button>
      </div>
      <div class="meet-reactions">
        <div class="react-btn" data-emoji="😂">😂</div>
        <div class="react-btn" data-emoji="👏">👏</div>
        <div class="react-btn" data-emoji="❤️">❤️</div>
        <div class="react-btn" data-emoji="😮">😮</div>
        <div class="react-btn" data-emoji="🎉">🎉</div>
        <div class="react-btn" data-emoji="🔥">🔥</div>
      </div>
    </div>

  </div><!-- /workspace -->
  <!-- DOCK -->
  <div class="chrome-dock">
    <button class="bar-btn active" id="bar-paper" data-w="paper">
      <span class="bar-icon">📄</span><span class="bar-label">Docs</span>
    </button>
    <button class="bar-btn" id="bar-terminal" data-w="terminal">
      <span class="bar-icon">💻</span><span class="bar-label">Terminal</span>
    </button>
    <button class="bar-btn" id="bar-call" data-w="call">
      <span class="bar-icon">📹</span><span class="bar-label">Meet</span>
    </button>
  </div>
</div>

<!-- CONFETTI -->
<div id="confetti-container"></div>

<script>
'use strict';
// ===== AUDIO ENGINE =====
var audioCtx = null;
var sound = {
  init: function() {
    if (audioCtx) return;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  },
  play: function(name) {
    try { this.init(); if (!audioCtx) return; } catch(e) { return; }
    var now = audioCtx.currentTime;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    try {
      switch(name) {
        case 'sparkle': o.frequency.value=1047; g.gain.setValueAtTime(.15,now); g.gain.exponentialRampToValueAtTime(.001,now+.15); o.start(now); o.stop(now+.15); break;
        case 'happy':
          [523,659,784,1047].forEach(function(f,i) {
            var o2=audioCtx.createOscillator(), g2=audioCtx.createGain();
            o2.connect(g2); g2.connect(audioCtx.destination);
            o2.frequency.value=f; g2.gain.setValueAtTime(.12,now+i*.08); g2.gain.exponentialRampToValueAtTime(.001,now+i*.08+.15);
            o2.start(now+i*.08); o2.stop(now+i*.08+.15);
          }); break;
        case 'twinkle':
          [264,264,396,396,440,440,396].forEach(function(f,i) {
            var o2=audioCtx.createOscillator(), g2=audioCtx.createGain();
            o2.connect(g2); g2.connect(audioCtx.destination);
            o2.frequency.value=f; g2.gain.setValueAtTime(.1,now+i*.2); g2.gain.exponentialRampToValueAtTime(.001,now+i*.2+.18);
            o2.start(now+i*.2); o2.stop(now+i*.2+.18);
          }); break;
        case 'enter': [392,494,587].forEach(function(f,i){var o2=audioCtx.createOscillator(),g2=audioCtx.createGain();o2.connect(g2);g2.connect(audioCtx.destination);o2.frequency.value=f;g2.gain.setValueAtTime(.1,now+i*.06);g2.gain.exponentialRampToValueAtTime(.001,now+i*.06+.12);o2.start(now+i*.06);o2.stop(now+i*.06+.12);}); break;
        case 'snap': var buf=audioCtx.createBuffer(1,audioCtx.sampleRate*.05,audioCtx.sampleRate);var d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.3;var src=audioCtx.createBufferSource();src.buffer=buf;var g2=audioCtx.createGain();g2.gain.setValueAtTime(.3,now);g2.gain.exponentialRampToValueAtTime(.001,now+.05);src.connect(g2);g2.connect(audioCtx.destination);src.start(now); break;
        case 'err': o.frequency.value=150;o.type='sawtooth';g.gain.setValueAtTime(.1,now);g.gain.exponentialRampToValueAtTime(.001,now+.3);o.start(now);o.stop(now+.3); break;
        default: o.frequency.value=440;g.gain.setValueAtTime(.1,now);g.gain.exponentialRampToValueAtTime(.001,now+.1);o.start(now);o.stop(now+.1);
      }
    } catch(e) {}
  }
};

// ===== STATE =====
var state = { world: 'paper', entered: false };

// ===== CELEBRATIONS =====
function sparkleBurst(x, y, n) {
  n = n || 12;
  var emojis = ['✨','⭐','🌟','💫','✦'];
  for (var i = 0; i < n; i++) {
    var el = document.createElement('div');
    el.className = 'sparkle';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = (x + (Math.random() - .5) * 80) + 'px';
    el.style.top  = (y + (Math.random() - .5) * 60) + 'px';
    document.body.appendChild(el);
    setTimeout(function() { el.remove(); }, 1000);
  }
}

function confettiBurst() {
  try {
    var el = document.getElementById('confetti-container');
    if (!el) return;
    var colors = ['#ff6b6b','#ff8c42','#ffd93d','#6bcb77','#4d96ff','#c77dff'];
    for (var i = 0; i < 40; i++) {
      var c = document.createElement('div');
      c.style.cssText = 'position:fixed;width:10px;height:10px;background:' + colors[Math.floor(Math.random()*colors.length)] +
        ';left:' + (Math.random()*window.innerWidth) + 'px;top:-10px;border-radius:' + (Math.random()>.5?'50%':'2px') +
        ';pointer-events:none;z-index:200;transition:transform 1.5s ease-in,opacity 1.5s ease-in';
      document.body.appendChild(c);
      setTimeout(function(cc){cc.style.transform='translateY('+window.innerHeight+'px) rotate('+(Math.random()*720-360)+'deg)';cc.style.opacity='0';},10,c);
      setTimeout(function(cc){cc.remove();},1600,c);
    }
  } catch(e) {}
}

function emojiCascade(emojis) {
  emojis = emojis || ['🎉','🎊','⭐','✨'];
  var container = document.createElement('div');
  container.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:400;overflow:hidden';
  document.body.appendChild(container);
  for (var i = 0; i < 20; i++) {
    var e = document.createElement('div');
    e.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    e.style.cssText = 'position:absolute;font-size:32px;left:' + Math.random()*window.innerWidth + 'px;top:-40px;transition:transform 2.5s ease-in,opacity 2.5s;animation-delay:' + (Math.random()*.5) + 's';
    container.appendChild(e);
    setTimeout(function(ee){ee.style.transform='translateY('+(window.innerHeight+60)+'px)';ee.style.opacity='0';},50,e);
    setTimeout(function(c){c.remove();},3000,container);
  }
}

// ===== SWITCH WORLD =====
function switchWorld(world) {
  // hide all worlds
  document.querySelectorAll('.world').forEach(function(el){ el.classList.remove('active'); });
  // show target
  var w = document.getElementById(world + '-world');
  if (w) w.classList.add('active');
  // update chrome tabs
  document.querySelectorAll('.chrome-tab').forEach(function(t){ t.classList.remove('active'); });
  var tab = document.getElementById('tab-' + world);
  if (tab) tab.classList.add('active');
  // update dock
  document.querySelectorAll('.bar-btn').forEach(function(b){ b.classList.remove('active'); });
  var bar = document.getElementById('bar-' + world);
  if (bar) bar.classList.add('active');
  state.world = world;
  // init world
  if (world === 'terminal') initTerminal();
  else if (world === 'call') initCall();
  else if (world === 'paper') initDocs();
}

// ===== INIT WORLD FUNCTIONS =====
function initDocs() {
  // nothing heavy needed
}

function initTerminal() {
  var container = document.getElementById('term-cards');
  if (!container || container.children.length > 0) return;
  var cmds = [
    {icon:'🏓',label:'ping',cmd:'ping'},
    {icon:'🚀',label:'deploy',cmd:'deploy'},
    {icon:'💾',label:'backup',cmd:'backup'},
    {icon:'🖥️',label:'scan',cmd:'scan'},
    {icon:'🎨',label:'color',cmd:'color'},
    {icon:'🌈',label:'rainbow',cmd:'rainbow'},
    {icon:'💥',label:'boom',cmd:'boom'},
    {icon:'🦠',label:'virus',cmd:'virus'}
  ];
  cmds.forEach(function(c) {
    var btn = document.createElement('button');
    btn.className = 'term-card';
    btn.innerHTML = '<span class="term-card-icon">'+c.icon+'</span><span>'+c.label+'</span>';
    btn.addEventListener('click', function(e) {
      try { sound.play('snap'); sparkleBurst(e.clientX, e.clientY, 8); } catch(err){}
      runCommand(c.cmd);
    });
    container.appendChild(btn);
  });
}

function runCommand(cmd) {
  var display = document.getElementById('term-display');
  if (!display) return;
  var out = document.createElement('div');
  out.style.marginBottom = '4px';
  switch(cmd) {
    case 'ping': out.textContent = 'Pinging localhost... 64 bytes: time=0.1ms'; break;
    case 'deploy': out.textContent = 'Deploying... Done! ✓'; emojiCascade(['🚀']); break;
    case 'backup': out.textContent = 'Backing up... 100% complete ✓'; emojiCascade(['💾']); break;
    case 'scan': out.textContent = 'Scanning... 0 vulnerabilities found ✓'; break;
    case 'color': out.textContent = '🌈🌈🌈🌈🌈🌈🌈🌈'; out.style.color='#ff6b6b'; out.style.textShadow='0 0 8px #ff6b6b'; emojiCascade(['🎨']); break;
    case 'rainbow': out.textContent = 'R G B Y P!'; break;
    case 'boom': out.textContent = '💥💥💥 BOOM! 💥💥💥'; confettiBurst(); emojiCascade(['💥','🔥']); break;
    case 'virus': out.textContent = 'VIRUS DETECTED! 🦠 quarantined ✓'; break;
    default: out.textContent = 'command not found: ' + cmd;
  }
  display.appendChild(out);
  display.scrollTop = display.scrollHeight;
}

function initCall() {
  // tile waving animation
  var tiles = document.querySelectorAll('.meet-tile');
  tiles.forEach(function(t, i) {
    if (i % 2 === 1) {
      t.querySelector('.meet-wave').style.animationDelay = (i * .4) + 's';
    }
  });
  // speaking highlight (fake)
  setInterval(function() {
    tiles.forEach(function(t){ t.classList.remove('speaking'); });
    var idx = Math.floor(Math.random() * tiles.length);
    tiles[idx].classList.add('speaking');
  }, 2000);
}

// ===== ENTER =====
function doEnter() {
  try { sound.play('happy'); } catch(e) {}
  var home = document.getElementById('home-screen');
  if (home) home.style.display = 'none';
  var frame = document.getElementById('chrome-frame');
  if (frame) frame.classList.add('visible');
  sparkleBurst(window.innerWidth / 2, window.innerHeight / 2, 20);
  confettiBurst();
  state.entered = true;
}

// ===== FULLSCREEN =====
function tryFullscreen() {
  try {
    var el = document.documentElement;
    var rf = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (rf) rf.call(el);
  } catch(e) {}
}

// ===== STARS =====
function makeStars() {
  var container = document.getElementById('stars');
  if (!container) return;
  for (var i = 0; i < 80; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = Math.random() * 2 + 's';
    s.style.width = s.style.height = (Math.random() * 2 + 1) + 'px';
    container.appendChild(s);
  }
}

// ===== KEYBOARD INPUT =====
function setupKeyboard() {
  var input = document.getElementById('term-input');
  if (!input) return;
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      var val = input.value.trim();
      if (!val) return;
      try { sound.play('enter'); sparkleBurst(input.getBoundingClientRect().left, input.getBoundingClientRect().top, 6); } catch(err){}
      var display = document.getElementById('term-display');
      if (display) {
        var line = document.createElement('div');
        line.style.color = '#4fc3f7';
        line.textContent = '> ' + val;
        display.appendChild(line);
      }
      input.value = '';
      // fake commands
      var fake = {ping:'Pinging localhost... 64 bytes: time=0.1ms',help:'Available: ping, deploy, backup, scan, color, rainbow, boom, virus',neofetch:'Ichlas-PC @ clickety-desk\nOS: ClicketyOS 1.0\nKernel: Brain 5.0\nUptime: forever\nShell: clicky-sh'};
      var display2 = document.getElementById('term-display');
      if (display2) {
        var out2 = document.createElement('div');
        out2.textContent = fake[val] || 'command not found: ' + val;
        display2.appendChild(out2);
        display2.scrollTop = display2.scrollHeight;
      }
    }
  });
}

// ===== DOCS TOOLBAR =====
function setupDocs() {
  var area = document.getElementById('docs-area');
  if (!area) return;
  var btnBold = document.getElementById('btn-bold');
  if (btnBold) btnBold.addEventListener('click', function() {
    try { sound.play('sparkle'); sparkleBurst(btnBold.getBoundingClientRect().left, btnBold.getBoundingClientRect().top, 5); } catch(e){}
    document.execCommand('bold');
  });
  var btnItalic = document.getElementById('btn-italic');
  if (btnItalic) btnItalic.addEventListener('click', function() {
    try { sound.play('sparkle'); sparkleBurst(btnItalic.getBoundingClientRect().left, btnItalic.getBoundingClientRect().top, 5); } catch(e){}
    document.execCommand('italic');
  });
  var colors = [
    {id:'btn-red',color:'#ef4444'},
    {id:'btn-green',color:'#22c55e'},
    {id:'btn-blue',color:'#3b82f6'}
  ];
  colors.forEach(function(c) {
    var btn = document.getElementById(c.id);
    if (btn) btn.addEventListener('click', function(e) {
      try { sound.play('sparkle'); sparkleBurst(btn.getBoundingClientRect().left, btn.getBoundingClientRect().top, 5); } catch(e){}
      document.execCommand('foreColor', false, c.color);
    });
  });
}

// ===== MEET CONTROLS =====
function setupMeet() {
  var btnMute = document.getElementById('btn-mute');
  if (btnMute) btnMute.addEventListener('click', function() {
    try { sound.play('snap'); } catch(e){}
    btnMute.classList.toggle('on');
  });
  var btnCam = document.getElementById('btn-cam');
  if (btnCam) btnCam.addEventListener('click', function() {
    try { sound.play('snap'); } catch(e){}
    btnCam.classList.toggle('on');
  });
  var btnShare = document.getElementById('btn-share');
  if (btnShare) btnShare.addEventListener('click', function() {
    try { sound.play('sparkle'); emojiCascade(['📤','📎']); } catch(e){}
  });
  var btnHand = document.getElementById('btn-hand');
  if (btnHand) btnHand.addEventListener('click', function() {
    try { sound.play('happy'); } catch(e){}
    btnHand.classList.toggle('on');
    if (btnHand.classList.contains('on')) emojiCascade(['✋','🙋']);
  });
  document.querySelectorAll('.react-btn').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      try { sound.play('twinkle'); sparkleBurst(e.clientX, e.clientY, 8); emojiCascade([btn.dataset.emoji]); } catch(err){}
    });
  });
}

// ===== SETUP ALL CLICK HANDLERS =====
function setupHandlers() {
  // HOME ENTER
  var homeBtn = document.getElementById('home-enter-btn');
  if (homeBtn) homeBtn.addEventListener('click', function(e) {
    try { sound.play('happy'); sparkleBurst(e.clientX, e.clientY, 15); confettiBurst(); } catch(err){}
    tryFullscreen();
    doEnter();
    switchWorld('paper');
  });

  // THEME PILLS
  document.querySelectorAll('.pill').forEach(function(p) {
    p.addEventListener('click', function(e) {
      try { sound.play('sparkle'); sparkleBurst(e.clientX, e.clientY, 6); } catch(err){}
      document.querySelectorAll('.pill').forEach(function(pp){ pp.classList.remove('active'); });
      p.classList.add('active');
    });
  });

  // CHROME TABS
  document.querySelectorAll('.chrome-tab').forEach(function(tab) {
    tab.addEventListener('click', function(e) {
      var w = tab.dataset.w;
      if (!w) return;
      try { sound.play('sparkle'); sparkleBurst(e.clientX, e.clientY, 6); } catch(err){}
      switchWorld(w);
    });
  });

  // DOCK BUTTONS
  document.querySelectorAll('.bar-btn').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      var w = btn.dataset.w;
      if (!w) return;
      try { sound.play('sparkle'); sparkleBurst(e.clientX, e.clientY, 6); } catch(err){}
      switchWorld(w);
    });
  });

  // DOCS
  setupDocs();

  // MEET CONTROLS
  setupMeet();

  // TERMINAL INPUT
  setupKeyboard();
}

// ===== AUTO START =====
makeStars();
setupHandlers();
</script>
</body>
</html>
